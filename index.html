<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 Comic Reader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* ─── Reset & Base ─── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0b0b0b;
            --bg-secondary: #141414;
            --bg-surface: #1e1e1e;
            --bg-surface-hover: #2a2a2a;
            --bg-elevated: #282828;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --text-muted: #6a6a6a;
            /* Green accent */
            --accent: #2ecc71;
            --accent-hover: #58d68d;
            --accent-dim: rgba(46, 204, 113, 0.15);
            --border-color: #2e2e2e;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.8);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font);
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
        }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ─── Upload View ─── */
        #uploadView {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 24px;
            background: var(--bg-primary);
            position: relative;
            z-index: 1;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        #uploadView.hidden {
            opacity: 0;
            transform: scale(0.96);
            pointer-events: none;
        }

        .upload-container {
            max-width: 640px;
            width: 100%;
            text-align: center;
        }

        .upload-icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: block;
            opacity: 0.7;
        }

        .upload-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #2ecc71, #58d68d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .upload-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 56px 32px;
            background: var(--bg-secondary);
            transition: border-color var(--transition), background var(--transition), transform var(--transition);
            cursor: pointer;
            position: relative;
        }
        .drop-zone:hover {
            border-color: var(--accent);
            background: var(--bg-surface);
        }
        .drop-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-dim);
            transform: scale(1.01);
        }
        .drop-zone .drop-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }
        .drop-zone .drop-text {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .drop-zone .drop-hint {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 8px;
        }
        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .upload-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            font-family: var(--font);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn:hover {
            background: var(--bg-surface-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .btn:active {
            transform: translateY(0px) scale(0.97);
        }

        .btn-primary {
            background: var(--accent);
            color: #0b0b0b;
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            box-shadow: 0 8px 32px rgba(46, 204, 113, 0.3);
        }

        .btn-ghost {
            background: transparent;
            border-color: var(--border-color);
        }
        .btn-ghost:hover {
            background: var(--bg-surface);
            border-color: var(--text-muted);
        }

        /* ─── Reader View ─── */
        #readerView {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 10;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #readerView.active {
            display: flex;
            opacity: 1;
        }

        /* Top Bar */
        .reader-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(11, 11, 11, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 20;
            min-height: 60px;
        }
        .reader-topbar .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .reader-topbar .title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 260px;
        }
        .reader-topbar .title .folder-name {
            color: var(--text-secondary);
            font-weight: 400;
        }
        .reader-topbar .page-info {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }
        .reader-topbar .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .reader-topbar .actions .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reader-topbar .actions .btn-icon:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
        }
        .reader-topbar .actions .btn-icon:active {
            transform: scale(0.92);
        }
        .reader-topbar .actions .btn-icon.active-btn {
            color: var(--accent);
            background: var(--accent-dim);
        }

        /* Image Container */
        .reader-main {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            min-height: 0;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 4px 60px rgba(0, 0, 0, 0.6);
            transition: opacity 0.25s ease, transform 0.25s ease;
            will-change: transform, opacity;
            image-rendering: auto;
        }
        .image-wrapper img.loading {
            opacity: 0;
            transform: scale(0.96);
        }
        .image-wrapper img.loaded {
            opacity: 1;
            transform: scale(1);
        }

        /* Navigation Arrows */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .nav-arrow:hover {
            background: rgba(46, 204, 113, 0.2);
            border-color: var(--accent);
            transform: translateY(-50%) scale(1.08);
        }
        .nav-arrow:active {
            transform: translateY(-50%) scale(0.92);
        }
        .nav-arrow.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .nav-arrow.prev {
            left: 20px;
        }
        .nav-arrow.next {
            right: 20px;
        }
        .nav-arrow svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Bottom Bar: Thumbnails */
        .reader-bottombar {
            flex-shrink: 0;
            background: rgba(11, 11, 11, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            padding: 10px 0;
            height: 100px;
            display: flex;
            align-items: center;
            overflow: hidden;
            transition: height var(--transition), opacity var(--transition), padding var(--transition);
            z-index: 20;
        }
        .reader-bottombar.collapsed {
            height: 0;
            padding: 0;
            opacity: 0;
            border-top: none;
            pointer-events: none;
        }

        .thumbnail-strip {
            display: flex;
            gap: 8px;
            padding: 0 20px;
            overflow-x: auto;
            overflow-y: hidden;
            align-items: center;
            height: 100%;
            width: 100%;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .thumbnail-strip .thumb-item {
            flex: 0 0 auto;
            width: 60px;
            height: 72px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all var(--transition);
            position: relative;
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .thumbnail-strip .thumb-item:hover {
            transform: scale(1.05);
            border-color: var(--text-muted);
        }
        .thumbnail-strip .thumb-item.active {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.2);
            transform: scale(1.05);
        }
        .thumbnail-strip .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .thumbnail-strip .thumb-item .thumb-index {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 9px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.6);
            padding: 0 5px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* Loading Spinner */
        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .spinner.show {
            opacity: 1;
        }
        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* Empty state in reader */
        .reader-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 12px;
            padding: 40px;
        }
        .reader-empty .empty-icon {
            font-size: 56px;
            opacity: 0.4;
        }
        .reader-empty .empty-text {
            font-size: 18px;
        }

        /* ─── Toast / Notification ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-surface);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            border-color: #e74c3c;
            color: #e74c3c;
        }
        .toast.success {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .upload-title {
                font-size: 26px;
            }
            .drop-zone {
                padding: 36px 20px;
            }
            .drop-zone .drop-icon {
                font-size: 36px;
            }
            .drop-zone .drop-text {
                font-size: 16px;
            }

            .reader-topbar {
                padding: 8px 14px;
                min-height: 52px;
            }
            .reader-topbar .title {
                font-size: 14px;
                max-width: 120px;
            }
            .reader-topbar .page-info {
                font-size: 12px;
                padding: 3px 10px;
            }
            .reader-topbar .actions .btn-icon {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }

            .nav-arrow {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
            .nav-arrow.prev {
                left: 8px;
            }
            .nav-arrow.next {
                right: 8px;
            }
            .nav-arrow svg {
                width: 22px;
                height: 22px;
            }

            .reader-bottombar {
                height: 74px;
                padding: 6px 0;
            }
            .reader-bottombar.collapsed {
                height: 0;
            }
            .thumbnail-strip {
                padding: 0 12px;
                gap: 6px;
            }
            .thumbnail-strip .thumb-item {
                width: 44px;
                height: 54px;
            }
            .thumbnail-strip .thumb-item .thumb-index {
                font-size: 7px;
                padding: 0 3px;
            }

            .btn {
                padding: 10px 20px;
                font-size: 13px;
            }
            .toast {
                font-size: 13px;
                padding: 12px 20px;
                bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            .upload-title {
                font-size: 22px;
            }
            .upload-subtitle {
                font-size: 14px;
            }
            .drop-zone {
                padding: 28px 16px;
            }

            .reader-topbar .title {
                max-width: 80px;
                font-size: 12px;
            }
            .reader-topbar .page-info {
                font-size: 11px;
            }

            .nav-arrow {
                width: 38px;
                height: 38px;
            }
            .nav-arrow svg {
                width: 18px;
                height: 18px;
            }

            .thumbnail-strip .thumb-item {
                width: 38px;
                height: 46px;
            }
            .reader-bottombar {
                height: 62px;
            }
        }

        /* ─── Utilities ─── */
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gap-8 {
            gap: 8px;
        }
    </style>
</head>
<body>

    <!-- ─── TOAST ─── -->
    <div id="toast" class="toast"></div>

    <!-- ─── UPLOAD VIEW ─── -->
    <div id="uploadView">
        <div class="upload-container">
            <span class="upload-icon">📖</span>
            <h1 class="upload-title">Comic Reader</h1>
            <p class="upload-subtitle">
                Upload a folder of JPG, PNG, or WebP images and read them like a book.
            </p>

            <div class="drop-zone" id="dropZone">
                <span class="drop-icon">📁</span>
                <div class="drop-text">Drop your folder here</div>
                <div class="drop-hint">or click to browse</div>
                <input type="file" id="folderInput" webkitdirectory multiple accept=".jpg,.jpeg,.png,.webp,.JPG,.JPEG,.PNG,.WEBP" />
            </div>

            <div class="upload-actions">
                <button class="btn btn-primary" id="uploadBtn">
                    <span>📂</span> Choose Folder
                </button>
                <button class="btn btn-ghost" id="helpBtn">
                    <span>❓</span> Help
                </button>
            </div>
        </div>
    </div>

    <!-- ─── READER VIEW ─── -->
    <div id="readerView">
        <!-- Top Bar -->
        <div class="reader-topbar">
            <div class="left">
                <button class="btn-icon" id="closeReader" title="Close reader" aria-label="Close reader">
                    ✕
                </button>
                <span class="title" id="readerTitle">
                    <span class="folder-name" id="folderName">Folder</span>
                </span>
            </div>
            <span class="page-info" id="pageInfo">Page 0 / 0</span>
            <div class="actions">
                <button class="btn-icon" id="toggleThumbs" title="Toggle thumbnails" aria-label="Toggle thumbnails">
                    ▦
                </button>
                <button class="btn-icon" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">
                    ⛶
                </button>
            </div>
        </div>

        <!-- Main Image -->
        <div class="reader-main" id="readerMain">
            <div class="image-wrapper" id="imageWrapper">
                <img id="mainImage" alt="Comic page" class="loading" />
                <div class="spinner" id="spinner"></div>
            </div>

            <!-- Navigation Arrows -->
            <button class="nav-arrow prev" id="prevBtn" aria-label="Previous page">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor"/></svg>
            </button>
            <button class="nav-arrow next" id="nextBtn" aria-label="Next page">
                <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" stroke="currentColor"/></svg>
            </button>
        </div>

        <!-- Bottom Bar: Thumbnails -->
        <div class="reader-bottombar" id="bottomBar">
            <div class="thumbnail-strip" id="thumbStrip"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const uploadView = document.getElementById('uploadView');
            const readerView = document.getElementById('readerView');
            const folderInput = document.getElementById('folderInput');
            const dropZone = document.getElementById('dropZone');
            const uploadBtn = document.getElementById('uploadBtn');
            const helpBtn = document.getElementById('helpBtn');
            const closeReader = document.getElementById('closeReader');
            const mainImage = document.getElementById('mainImage');
            const imageWrapper = document.getElementById('imageWrapper');
            const spinner = document.getElementById('spinner');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageInfo = document.getElementById('pageInfo');
            const folderName = document.getElementById('folderName');
            const readerTitle = document.getElementById('readerTitle');
            const thumbStrip = document.getElementById('thumbStrip');
            const bottomBar = document.getElementById('bottomBar');
            const toggleThumbs = document.getElementById('toggleThumbs');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const toast = document.getElementById('toast');

            // ─── State ───
            let images = []; // Array of { name, file, url }
            let currentIndex = 0;
            let isReading = false;
            let thumbsVisible = true;
            let isLoading = false;
            let toastTimeout = null;

            // ─── Helpers ───
            function formatFileName(name) {
                // Remove extension and clean up
                return name.replace(/\.[^.]+$/, '').replace(/[_\-]+/g, ' ');
            }

            function naturalSort(a, b) {
                return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
            }

            function showToast(message, type = 'success') {
                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                    toast.classList.remove('show', 'error', 'success');
                }
                toast.textContent = message;
                toast.className = 'toast ' + type;
                // Force reflow
                void toast.offsetWidth;
                toast.classList.add('show');
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimeout = null;
                }, 3000);
            }

            function showError(message) {
                showToast(message, 'error');
            }

            // ─── Image loading ───
            function loadImage(index) {
                if (!images.length || index < 0 || index >= images.length) return;

                const item = images[index];
                if (!item) return;

                isLoading = true;
                spinner.classList.add('show');
                mainImage.classList.add('loading');
                mainImage.classList.remove('loaded');

                // Create object URL if not already created
                if (!item.url) {
                    item.url = URL.createObjectURL(item.file);
                }

                mainImage.src = item.url;
                mainImage.onload = function() {
                    isLoading = false;
                    spinner.classList.remove('show');
                    mainImage.classList.remove('loading');
                    mainImage.classList.add('loaded');
                    updatePageInfo();
                    updateThumbnails();
                    updateArrows();
                };
                mainImage.onerror = function() {
                    isLoading = false;
                    spinner.classList.remove('show');
                    mainImage.classList.remove('loading');
                    mainImage.classList.add('loaded');
                    // Show placeholder or error state
                    mainImage.alt = 'Failed to load image';
                    showError('Failed to load page ' + (index + 1));
                    updatePageInfo();
                    updateThumbnails();
                    updateArrows();
                };

                // Preload next and previous images for smoother navigation
                preloadAdjacent(index);
            }

            function preloadAdjacent(index) {
                const prev = index - 1;
                const next = index + 1;
                if (prev >= 0 && images[prev] && !images[prev].url) {
                    images[prev].url = URL.createObjectURL(images[prev].file);
                    const img = new Image();
                    img.src = images[prev].url;
                }
                if (next < images.length && images[next] && !images[next].url) {
                    images[next].url = URL.createObjectURL(images[next].file);
                    const img = new Image();
                    img.src = images[next].url;
                }
            }

            // ─── Navigation ───
            function goTo(index) {
                if (isLoading) return;
                if (index < 0) index = 0;
                if (index >= images.length) index = images.length - 1;
                if (index === currentIndex && mainImage.src) return;
                currentIndex = index;
                loadImage(currentIndex);
                // Scroll thumbnail into view
                const thumbs = thumbStrip.querySelectorAll('.thumb-item');
                if (thumbs[currentIndex]) {
                    thumbs[currentIndex].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
                }
            }

            function nextPage() {
                if (currentIndex < images.length - 1) {
                    goTo(currentIndex + 1);
                } else {
                    showToast('You\'re on the last page', 'success');
                }
            }

            function prevPage() {
                if (currentIndex > 0) {
                    goTo(currentIndex - 1);
                } else {
                    showToast('You\'re on the first page', 'success');
                }
            }

            function updateArrows() {
                prevBtn.classList.toggle('visible', currentIndex > 0);
                nextBtn.classList.toggle('visible', currentIndex < images.length - 1);
            }

            function updatePageInfo() {
                pageInfo.textContent = `Page ${currentIndex + 1} / ${images.length}`;
            }

            // ─── Thumbnails ───
            function buildThumbnails() {
                thumbStrip.innerHTML = '';
                images.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'thumb-item';
                    if (index === currentIndex) div.classList.add('active');

                    const img = document.createElement('img');
                    // Use the already-loaded URL if available, otherwise load it
                    if (item.url) {
                        img.src = item.url;
                    } else {
                        // Create URL for thumbnail
                        item.url = URL.createObjectURL(item.file);
                        img.src = item.url;
                    }
                    img.alt = `Page ${index + 1}`;
                    img.loading = 'lazy';

                    const span = document.createElement('span');
                    span.className = 'thumb-index';
                    span.textContent = index + 1;

                    div.appendChild(img);
                    div.appendChild(span);
                    div.addEventListener('click', () => {
                        goTo(index);
                    });
                    thumbStrip.appendChild(div);
                });
            }

            function updateThumbnails() {
                const thumbs = thumbStrip.querySelectorAll('.thumb-item');
                thumbs.forEach((el, i) => {
                    el.classList.toggle('active', i === currentIndex);
                });
            }

            // ─── Reader setup ───
            function enterReader(files) {
                // Filter supported image types
                const supportedExtensions = new Set(['jpg', 'jpeg', 'png', 'webp']);
                const filtered = [];
                for (const file of files) {
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (supportedExtensions.has(ext)) {
                        filtered.push({ name: file.name, file: file, url: null });
                    }
                }

                if (filtered.length === 0) {
                    showError('No supported images found (JPG, PNG, WebP).');
                    return;
                }

                // Sort naturally
                filtered.sort(naturalSort);
                images = filtered;
                currentIndex = 0;

                // Show reader
                uploadView.classList.add('hidden');
                readerView.classList.add('active');
                isReading = true;

                // Set folder name
                const firstFile = images[0]?.file;
                let folder = 'Comic';
                if (firstFile) {
                    // Try to get folder name from webkitRelativePath
                    const path = firstFile.webkitRelativePath || '';
                    if (path) {
                        const parts = path.split('/');
                        if (parts.length > 1) {
                            folder = parts[0];
                        }
                    }
                }
                folderName.textContent = folder;

                // Build thumbnails
                buildThumbnails();

                // Load first image
                loadImage(0);
                updateArrows();
                updatePageInfo();

                // Ensure bottom bar is visible
                bottomBar.classList.remove('collapsed');
                thumbsVisible = true;
                toggleThumbs.textContent = '▦';

                showToast(`Loaded ${images.length} page${images.length > 1 ? 's' : ''}`, 'success');
            }

            // ─── Exit reader ───
            function exitReader() {
                if (!isReading) return;
                isReading = false;
                readerView.classList.remove('active');
                uploadView.classList.remove('hidden');

                // Clean up object URLs
                images.forEach(item => {
                    if (item.url) {
                        URL.revokeObjectURL(item.url);
                        item.url = null;
                    }
                });
                images = [];
                currentIndex = 0;
                mainImage.src = '';
                mainImage.classList.remove('loaded', 'loading');
                thumbStrip.innerHTML = '';
                pageInfo.textContent = 'Page 0 / 0';
                folderName.textContent = 'Folder';
                spinner.classList.remove('show');
                prevBtn.classList.remove('visible');
                nextBtn.classList.remove('visible');

                // Reset file input so same folder can be re-uploaded
                folderInput.value = '';
            }

            // ─── Toggle thumbnails ───
            function toggleThumbnails() {
                thumbsVisible = !thumbsVisible;
                bottomBar.classList.toggle('collapsed', !thumbsVisible);
                toggleThumbs.textContent = thumbsVisible ? '▦' : '▣';
            }

            // ─── Fullscreen ───
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen?.() ||
                        document.documentElement.webkitRequestFullscreen?.();
                } else {
                    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
                }
            }

            // ─── File handling ───
            function handleFiles(fileList) {
                if (!fileList || fileList.length === 0) return;
                const files = Array.from(fileList);
                // Filter for supported extensions
                const supportedExtensions = new Set(['jpg', 'jpeg', 'png', 'webp']);
                const valid = files.filter(f => {
                    const ext = f.name.split('.').pop().toLowerCase();
                    return supportedExtensions.has(ext);
                });
                if (valid.length === 0) {
                    showError('No supported images found (JPG, PNG, WebP). Please select a folder with images.');
                    return;
                }
                enterReader(files);
            }

            // ─── Drag & Drop ───
            let dragCounter = 0;

            function handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'copy';
                dropZone.classList.add('dragover');
            }

            function handleDragLeave(e) {
                e.preventDefault();
                dragCounter--;
                if (dragCounter === 0) {
                    dropZone.classList.remove('dragover');
                }
            }

            function handleDrop(e) {
                e.preventDefault();
                dragCounter = 0;
                dropZone.classList.remove('dragover');

                const items = e.dataTransfer.items;
                if (!items) return;

                const files = [];
                const promises = [];

                for (let i = 0; i < items.length; i++) {
                    const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
                    if (entry) {
                        if (entry.isDirectory) {
                            promises.push(traverseDirectory(entry, files));
                        } else if (entry.isFile) {
                            promises.push(new Promise((resolve) => {
                                items[i].getAsFile((file) => {
                                    if (file) files.push(file);
                                    resolve();
                                });
                            }));
                        }
                    } else {
                        // Fallback: try to get as file
                        const file = items[i].getAsFile();
                        if (file) files.push(file);
                    }
                }

                Promise.all(promises).then(() => {
                    if (files.length === 0) {
                        showError('No files found in the dropped folder.');
                        return;
                    }
                    handleFiles(files);
                }).catch(() => {
                    showError('Error reading dropped folder. Please try again.');
                });
            }

            function traverseDirectory(entry, files) {
                return new Promise((resolve, reject) => {
                    const reader = entry.createReader();
                    const allEntries = [];

                    function readEntries() {
                        reader.readEntries((entries) => {
                            if (entries.length === 0) {
                                // Done with this directory
                                Promise.all(allEntries.map(e => {
                                    if (e.isDirectory) {
                                        return traverseDirectory(e, files);
                                    } else if (e.isFile) {
                                        return new Promise((res) => {
                                            e.file((file) => {
                                                files.push(file);
                                                res();
                                            }, () => res());
                                        });
                                    }
                                    return Promise.resolve();
                                })).then(resolve).catch(reject);
                            } else {
                                allEntries.push(...entries);
                                readEntries();
                            }
                        }, reject);
                    }
                    readEntries();
                });
            }

            // ─── Keyboard shortcuts ───
            document.addEventListener('keydown', (e) => {
                if (!isReading) return;

                // Don't trigger if typing in an input
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                switch (e.key) {
                    case 'ArrowRight':
                    case 'ArrowDown':
                    case ' ':
                        e.preventDefault();
                        nextPage();
                        break;
                    case 'ArrowLeft':
                    case 'ArrowUp':
                        e.preventDefault();
                        prevPage();
                        break;
                    case 'Home':
                        e.preventDefault();
                        goTo(0);
                        break;
                    case 'End':
                        e.preventDefault();
                        goTo(images.length - 1);
                        break;
                    case 'f':
                    case 'F':
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                    case 't':
                    case 'T':
                        e.preventDefault();
                        toggleThumbnails();
                        break;
                    case 'Escape':
                        if (document.fullscreenElement) {
                            document.exitFullscreen?.() || document.webkitExitFullscreen?.();
                        } else {
                            exitReader();
                        }
                        break;
                }
            });

            // ─── Click on image to go next ───
            mainImage.addEventListener('click', (e) => {
                if (!isReading || isLoading) return;
                // Only trigger if click is on the image itself
                if (e.target === mainImage) {
                    // If click is on right half, go next; left half, go prev
                    const rect = mainImage.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    if (x > rect.width * 0.5) {
                        nextPage();
                    } else {
                        prevPage();
                    }
                }
            });

            // ─── Touch swipe support ───
            let touchStartX = 0;
            let touchStartY = 0;
            let isSwiping = false;

            const readerMain = document.getElementById('readerMain');

            readerMain.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                isSwiping = true;
            }, { passive: true });

            readerMain.addEventListener('touchmove', (e) => {
                if (!isSwiping) return;
                // Prevent page scroll while swiping
                e.preventDefault();
            }, { passive: false });

            readerMain.addEventListener('touchend', (e) => {
                if (!isSwiping) return;
                isSwiping = false;
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;
                const dx = endX - touchStartX;
                const dy = endY - touchStartY;

                // Only trigger if horizontal swipe is dominant and long enough
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
                    if (dx < 0) {
                        nextPage();
                    } else {
                        prevPage();
                    }
                }
            }, { passive: true });

            // ─── Event listeners ───

            // Upload button
            uploadBtn.addEventListener('click', () => {
                folderInput.click();
            });

            // Folder input
            folderInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    handleFiles(e.target.files);
                }
                e.target.value = '';
            });

            // Drop zone
            dropZone.addEventListener('dragover', handleDragOver);
            dropZone.addEventListener('dragenter', (e) => {
                e.preventDefault();
                dragCounter++;
                dropZone.classList.add('dragover');
            });
            dropZone.addEventListener('dragleave', handleDragLeave);
            dropZone.addEventListener('drop', handleDrop);

            // Close reader
            closeReader.addEventListener('click', exitReader);

            // Navigation buttons
            prevBtn.addEventListener('click', prevPage);
            nextBtn.addEventListener('click', nextPage);

            // Toggle thumbnails
            toggleThumbs.addEventListener('click', toggleThumbnails);

            // Fullscreen
            fullscreenBtn.addEventListener('click', toggleFullscreen);

            // Help button
            helpBtn.addEventListener('click', () => {
                showToast('📖 Upload a folder of JPG, PNG, or WebP images. Use arrow keys or click the sides to flip pages.', 'success');
            });

            // ─── Handle window resize ───
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    // Re-center image if needed
                    if (mainImage.src) {
                        mainImage.style.transition = 'none';
                        requestAnimationFrame(() => {
                            mainImage.style.transition = '';
                        });
                    }
                }, 200);
            });

            // ─── Fullscreen change events ───
            document.addEventListener('fullscreenchange', updateFullscreenIcon);
            document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

            function updateFullscreenIcon() {
                const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
                fullscreenBtn.textContent = isFull ? '⛶' : '⛶';
                fullscreenBtn.classList.toggle('active-btn', isFull);
            }

            // ─── Prevent context menu on images ───
            mainImage.addEventListener('contextmenu', (e) => e.preventDefault());

            // ─── Init ───
            console.log('📚 Comic Reader loaded. Upload a folder to start reading.');

        })();
    </script>

</body>
</html>
